name: ruli_os
description: Planificacion personal con riel de horas diario y agenda hacia adelante.
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegacion
  go_router: ^14.2.7

  # Almacenamiento local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Avisos y alarmas
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # La letra va empaquetada dentro de la aplicacion y no se descarga en el
  # telefono: asi se ve igual sin conexion y desde el primer arranque. Solo
  # cuatro pesos, que son los que usa la escala tipografica; sumar los ocho
  # que trae la familia engordaria el APK sin que se notara la diferencia.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700

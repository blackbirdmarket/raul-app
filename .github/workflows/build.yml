name: Compilar APK

# Se ejecuta solo con cada cambio subido, y tambien a mano desde la pestana Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generar APK de release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          unzip -q raul_app.zip -d _tmp
          shopt -s dotglob
          mv _tmp/raul_app/* .
          rm -rf _tmp raul_app.zip
          ls -la

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter instalada
        run: flutter --version

      # Se genera en una carpeta aparte y solo se copia android/, para no
      # arriesgar que flutter create toque lib/ o pubspec.yaml.
      - name: Generar la carpeta android
        run: |
          flutter create --platforms=android --org cl.raulisaac --project-name raul_app /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Descargar dependencias
        run: flutter pub get

      - name: Revisar el codigo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Compilar el APK
        run: flutter build apk --release

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

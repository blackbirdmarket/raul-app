name: Compilar APK

# Se ejecuta solo con cada cambio subido, y tambien a mano desde la pestana Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generar APK de release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          unzip -q raul_app.zip -d _tmp
          shopt -s dotglob
          mv _tmp/raul_app/* .
          rm -rf _tmp raul_app.zip
          ls -la

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Fijada a la misma version que tiene Raul instalada. Si la fabrica usara
      # una version mas nueva, la carpeta android/ podria pedirle a su maquina
      # cosas que su Flutter no entiende, y tendriamos errores que solo
      # aparecen en su computador.
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.2
          channel: stable
          cache: true

      - name: Version de Flutter instalada
        run: flutter --version

      # android/ y web/ vienen dentro del proyecto y ya no se generan aqui.
      # Antes se creaban con `flutter create` en cada compilacion, lo que
      # borraba los permisos de alarma y la configuracion de Gradle que
      # necesitan las notificaciones.
      - name: Comprobar que las plataformas vienen en el proyecto
        run: |
          test -f android/app/build.gradle.kts || { echo "Falta android/"; exit 1; }
          test -f web/index.html || { echo "Falta web/"; exit 1; }
          grep -q 'isCoreLibraryDesugaringEnabled' android/app/build.gradle.kts \
            || { echo "Falta el desugaring que necesitan las alarmas"; exit 1; }
          grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml \
            || { echo "Faltan los permisos de aviso"; exit 1; }
          echo "Plataformas y permisos en orden."

      - name: Descargar dependencias
        run: flutter pub get

      - name: Revisar el codigo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # Proyecto completo para abrir en Android Studio y trabajar con recarga
      # instantanea. Se empaqueta antes de compilar para que no arrastre los
      # cientos de megas de build/, y sin local.properties porque ese archivo
      # apunta a rutas del runner y cada maquina genera el suyo.
      - name: Empaquetar el proyecto para Android Studio
        run: |
          rm -f android/local.properties
          mkdir -p /tmp/pack/ruli_os
          rsync -a \
            --exclude 'build/' \
            --exclude '.dart_tool/' \
            --exclude '.gradle/' \
            --exclude 'raul_app.zip' \
            ./ /tmp/pack/ruli_os/
          du -sh /tmp/pack/ruli_os

      - name: Publicar el proyecto para Android Studio
        uses: actions/upload-artifact@v4
        with:
          name: proyecto-android-studio
          path: /tmp/pack
          if-no-files-found: error
          retention-days: 30

      - name: Compilar la version web
        run: flutter build web --release

      - name: Publicar la version web
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: build/web
          if-no-files-found: error
          retention-days: 30

      # Un APK por arquitectura en vez de uno universal: cada uno pesa un
      # tercio y el telefono solo necesita el suyo.
      - name: Compilar los APK
        run: flutter build apk --release --split-per-abi

      - name: Tamano de cada APK
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Publicar el APK para telefonos modernos
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar el APK para telefonos antiguos
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

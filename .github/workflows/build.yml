name: Compilar APK

# Se ejecuta solo con cada cambio subido, y tambien a mano desde la pestana Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: Ruli OS
  PROJECT_NAME: ruli_os
  ORG: cl.raulisaac

jobs:
  build:
    name: Generar APK de release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          unzip -q raul_app.zip -d _tmp
          shopt -s dotglob
          mv _tmp/raul_app/* .
          rm -rf _tmp raul_app.zip
          ls -la

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter instalada
        run: flutter --version

      # Se genera en una carpeta aparte y solo se copia android/, para no
      # arriesgar que flutter create toque lib/ ni pubspec.yaml.
      - name: Generar la carpeta android
        run: |
          flutter create --platforms=android \
            --org "$ORG" --project-name "$PROJECT_NAME" /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      # flutter create deja el nombre tecnico como etiqueta. Bajo el icono
      # tiene que leerse el nombre de verdad.
      - name: Poner el nombre visible de la app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" "$MANIFEST"
          grep -n 'android:label' "$MANIFEST"

      - name: Descargar dependencias
        run: flutter pub get

      - name: Revisar el codigo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # Un APK por arquitectura en vez de uno universal: cada uno pesa un
      # tercio y el telefono solo necesita el suyo.
      - name: Compilar los APK
        run: flutter build apk --release --split-per-abi

      - name: Tamano de cada APK
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Publicar el APK para telefonos modernos
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar el APK para telefonos antiguos
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30
